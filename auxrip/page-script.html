<script type="application/ld+json">{"@context":"https://schema.org","@graph":[{"@type":"Organization","@id":"https://staticmassive.com/#org","name":"Static Massive","url":"https://staticmassive.com"},{"@type":"SoftwareApplication","@id":"https://staticmassive.com/pages/auxrip#app","name":"AuxRip","url":"https://staticmassive.com/pages/auxrip","applicationCategory":"MultimediaApplication","applicationSubCategory":"Audio recorder and soundboard","operatingSystem":"macOS 14.2 or later, Windows 10, Windows 11","description":"AuxRip is a desktop app for Mac and Windows by Static Massive. One click records whatever your computer is playing. Then trim it, layer it on tracks, play it back as a pad soundboard, and drag the result into OBS, Discord or a video editor. Public beta, free while in beta. Runs fully offline.","featureList":["Record in one click: Music, podcasts, meetings, calls, streams. Add your microphone too, or record the mic on its own. Pause and resume. Sound-activated records only while something is playing.","Trim, move and mix: Drag a clip's ends to trim; nothing is ever lost. Fade in and out, set volume and a 7-band EQ per clip, cut with the blade, split at silences. Undo anything.","Drag it straight out: Drag the finished sound into OBS, Discord, an editor or a folder as a file. Or export WAV or MP3: the whole mix, or one file per track.","Every track is a pad: Four banks of 16. Tap to play, hold to play only while held, loop, choke groups. Effects per pad: echo, reverb, pitch, phone, muffle, reverse.","Keys and Stream Deck: Keys 1 to 4, Q to R, A to F and Z to V play pads. Shortcuts work from any app, so a Stream Deck can fire them.","Keep it in time: Optional. Set a tempo, or read it from a music track, and clips snap to bars and beats. Speed pads up or down without changing pitch. Swing.","Time sounds to a video: Drop a video in and it plays above the timeline and pads, in step with them. Extract its audio as a track.","Offline and yours: AuxRip runs fully offline. Nothing is uploaded, and there are no accounts or API keys."],"offers":{"@type":"Offer","price":"0","priceCurrency":"USD","description":"Free while in public beta"},"downloadUrl":["https://github.com/StaticMassive/auxrip-downloads/releases/latest/download/AuxRip-mac.dmg","https://github.com/StaticMassive/auxrip-downloads/releases/latest/download/AuxRip-windows-setup.exe"],"image":"https://staticmassive.github.io/webimages/auxrip/02-recording.webp","author":{"@id":"https://staticmassive.com/#org"},"publisher":{"@id":"https://staticmassive.com/#org"}},{"@type":"FAQPage","mainEntity":[{"@type":"Question","name":"Is AuxRip free?","acceptedAnswer":{"@type":"Answer","text":"AuxRip is in public beta and free while the beta runs."}},{"@type":"Question","name":"What do I need to run it?","acceptedAnswer":{"@type":"Answer","text":"A Mac with macOS 14.2 or later, Apple silicon or Intel, or a PC with Windows 10 or 11."}},{"@type":"Question","name":"What can it record?","acceptedAnswer":{"@type":"Answer","text":"Whatever your computer is playing: a clip from a video, music, a podcast, a meeting or call, a stream, a game. Add your microphone too, or record the mic on its own."}},{"@type":"Question","name":"Why does my Mac say it cannot verify the app?","acceptedAnswer":{"@type":"Answer","text":"The first time, macOS may say it cannot verify the app. Open System Settings, then Privacy & Security, and click Open Anyway. Installing from Terminal with the line on this page avoids that step."}},{"@type":"Question","name":"How do I get the sound into OBS, Discord or my editor?","acceptedAnswer":{"@type":"Answer","text":"Drag it straight out of AuxRip and drop it in. Or export WAV or MP3: the whole mix, or one file per track."}},{"@type":"Question","name":"Does it work with a Stream Deck?","acceptedAnswer":{"@type":"Answer","text":"Yes. AuxRip shortcuts work from any app, so a Stream Deck key can fire a pad."}},{"@type":"Question","name":"Does anything get uploaded?","acceptedAnswer":{"@type":"Answer","text":"No. AuxRip runs fully offline. Nothing is uploaded and there are no accounts or API keys."}},{"@type":"Question","name":"Why does Windows say it protected my PC?","acceptedAnswer":{"@type":"Answer","text":"AuxRip is free and not registered with Microsoft, so the first launch shows this. Click More info, then Run anyway. You only do this once."}},{"@type":"Question","name":"How do I update AuxRip?","acceptedAnswer":{"@type":"Answer","text":"You don’t need to download it again. AuxRip updates itself from inside the app."}},{"@type":"Question","name":"Am I allowed to record this?","acceptedAnswer":{"@type":"Answer","text":"Record only what you have the right to record."}}]},{"@type":"BreadcrumbList","itemListElement":[{"@type":"ListItem","position":1,"name":"Static Massive","item":"https://staticmassive.com/"},{"@type":"ListItem","position":2,"name":"Software","item":"https://staticmassive.com/pages/software"},{"@type":"ListItem","position":3,"name":"AuxRip","item":"https://staticmassive.com/pages/auxrip"}]}]}</script>
